[build]
  publish = "public"
  functions = "netlify/functions"
  command = "npm run build"

[[redirects]]
  from = "/api/dashboard-data"
  to = "/.netlify/functions/dashboard-data"
  status = 200

[[redirects]]
  from = "/api/shared-state"
  to = "/.netlify/functions/shared-state"
  status = 200

[[redirects]]
  from = "/api/container-action"
  to = "/.netlify/functions/container-action"
  status = 200

[[redirects]]
  from = "/api/logistics-state"
  to = "/.netlify/functions/logistics-state"
  status = 200

[[redirects]]
  from = "/api/logistics-data"
  to = "/.netlify/functions/logistics-data"
  status = 200

[[redirects]]
  from = "/api/driver-log"
  to = "/.netlify/functions/driver-log"
  status = 200

[[headers]]
  for = "/api/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"

[[redirects]]
  from = "/api/sync-retry"
  to = "/.netlify/functions/sync-retry"
  status = 200

[[redirects]]
  from = "/api/roster"
  to = "/.netlify/functions/roster"
  status = 200

[[redirects]]
  from = "/api/workflow-effect"
  to = "/.netlify/functions/workflow-effect"
  status = 200

[[redirects]]
  from = "/api/job-action"
  to = "/.netlify/functions/job-action"
  status = 200

[[redirects]]
  from = "/api/driver-codes"
  to = "/.netlify/functions/driver-codes"
  status = 200

[[redirects]]
  from = "/api/driver-auth"
  to = "/.netlify/functions/driver-auth"
  status = 200

[[redirects]]
  from = "/api/driver-moves"
  to = "/.netlify/functions/driver-moves"
  status = 200

[[redirects]]
  from = "/api/driver-stop-action"
  to = "/.netlify/functions/driver-stop-action"
  status = 200

[[headers]]
  for = "/driver/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[redirects]]
  from = "/api/ghl-users"
  to = "/.netlify/functions/ghl-users"
  status = 200

[[redirects]]
  from = "/api/project-schedule"
  to = "/.netlify/functions/project-schedule"
  status = 200

[[redirects]]
  from = "/api/session"
  to = "/.netlify/functions/session"
  status = 200

[[redirects]]
  from = "/api/admins"
  to = "/.netlify/functions/admins"
  status = 200

[[redirects]]
  from = "/api/ghl-contacts"
  to = "/.netlify/functions/ghl-contacts"
  status = 200

[[redirects]]
  from = "/api/manual-workers"
  to = "/.netlify/functions/manual-workers"
  status = 200

[[redirects]]
  from = "/api/senior"
  to = "/.netlify/functions/senior"
  status = 200

[[redirects]]
  from = "/api/settings"
  to = "/.netlify/functions/settings"
  status = 200

[[redirects]]
  from = "/api/admin-dashboard"
  to = "/.netlify/functions/admin-dashboard"
  status = 200
